<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel | Auto Repair Emmanuel</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-head">
  <div class="wrap">
    <a class="brand" href="./"><img src="assets/img/favicon.svg" width="40" height="40" alt=""><span><span class="brand-mark">EMMANUEL</span><span class="brand-sub">Panel de solicitudes</span></span></a>
  </div>
</header>

<main class="admin">
  <h1>Solicitudes de cita</h1>
  <p class="form-msg" id="admin-msg" role="status" aria-live="polite"></p>

  <form class="form admin-login" id="login" hidden>
    <div class="field"><label for="a-email">Correo</label><input id="a-email" name="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="a-pass">Contraseña</label><input id="a-pass" name="password" type="password" autocomplete="current-password" required></div>
    <p style="margin:0"><button class="btn btn-dark" type="submit">Entrar</button></p>
  </form>

  <section id="panel" hidden>
    <div class="admin-bar"><span>Sesión: <strong id="who"></strong></span><button class="btn btn-line btn-sm" id="logout" type="button">Salir</button></div>
    <div class="admin-scroll">
      <table>
        <thead><tr><th>Recibida</th><th>Cliente</th><th>Carro</th><th>Servicio</th><th>Día</th><th>Comentario</th><th>Estado</th></tr></thead>
        <tbody id="bookings"><tr><td colspan="7">Cargando…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>
<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
