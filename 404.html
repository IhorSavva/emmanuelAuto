<script>
// GitHub Pages serves this page at any missing path, so relative links need a <base>.
// shortcut: assumes a project site (user.github.io/repo/) or own domain; a user site at github.io root would get a wrong base.
(function () {
  var p = location.pathname, base = "/";
  if (/\.github\.io$/.test(location.hostname) && p.split("/")[1]) base = "/" + p.split("/")[1] + "/";
  document.write('<base href="' + base + '">');
})();
</script>
